name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - rootfs/**
      - .github/workflows/build.yml
  schedule:
    # Weekly fallback rebuild, in case a base-image update lands without a
    # Dependabot-detected digest change (e.g. the vendor repushes the same tag).
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ties our tags back to the upstream vendor image version this build is
      # based on (Dockerfile pins it as `...aarch64:1.0.2@sha256:...`).
      - name: Read base image version
        id: base
        run: |
          version=$(grep -oP '(?<=hassio-ihost-silabs-multiprotocol-aarch64:)[0-9][0-9.]*' Dockerfile)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.base.outputs.version }}
            type=raw,value=${{ steps.base.outputs.version }}-{{sha}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Scans the actual built image (base OS packages, apt/pip installs —
      # everything, not just what Dependabot tracks in Dockerfile/requirements.txt)
      # for known CVEs and publishes results to the repo's Security tab.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: trivy-results.sarif
